<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>无痛英语 · 演示页</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 640px; margin: 40px auto; line-height: 1.9; color: #333; padding: 0 16px; }
    h1 { font-size: 22px; }
    .note { background: #f2f2f7; border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>今天天气很好，我们一起去公园吧</h1>

  <p>你好！我叫小明，很高兴认识你。我是一个学生，喜欢读书和听音乐。</p>
  <p>妈妈问我："今天想吃什么？"我说："随便，谢谢妈妈。"</p>
  <p>这个问题很简单，答案是显而易见的。但是很多人觉得学习很困难。</p>
  <p>辛苦了！你的工作做得很好。加油，继续努力，我相信你一定会成功。</p>
  <p>明天见！祝你有一个美好的周末。晚安，做个好梦。</p>
  <p>对不起，我不明白你的意思，请再说一遍好吗？</p>
  <p>最近怎么样？好久不见，最近工作忙不忙？注意身体，保重！</p>

  <div class="note">
    <b>演示说明：</b>安装插件后刷新本页，部分中文会被随机替换成英文，鼠标悬停在英文上可以看到中文释义。
    每次刷新随机结果都不同。也可以在插件弹窗里调整替换强度或关闭。
  </div>
</body>
</html>
